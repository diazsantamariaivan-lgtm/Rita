<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4e89">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%231d4e89%27/%3E%3Ctext x=%2750%27 y=%2766%27 font-size=%2744%27 font-weight=%27bold%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Arial,sans-serif%27%3EMD%3C/text%3E%3Crect x=%2724%27 y=%2774%27 width=%2752%27 height=%275%27 rx=%272%27 fill=%27%23e87722%27/%3E%3C/svg%3E">
<title>Rita</title>
<style>
:root{
  --bg:#f3f5f8;--card:#fff;--tx:#17212e;--mut:#667385;--line:#e1e6ed;
  --pri:#1d4e89;--pri2:#e5eef9;--acc:#e87722;--ok:#2e8b57;--bad:#c9302c;--warn:#b7791f;
  --sh:0 1px 3px rgba(20,40,70,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10151c;--card:#1a222d;--tx:#e8edf3;--mut:#93a1b3;--line:#2a3441;--pri:#5b9bdc;--pri2:#1e2f45;--acc:#f0903f;--ok:#4cc38a;--bad:#ef6a65;--warn:#e0b050;--sh:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:640px;margin:0 auto;min-height:100%;padding:0 14px calc(92px + env(safe-area-inset-bottom))}
header.top{padding:calc(16px + env(safe-area-inset-top)) 2px 6px}
header.top h1{font-size:22px;margin:0 0 2px}
header.top p{margin:0;color:var(--mut);font-size:14px;text-transform:capitalize}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:20px 4px 8px;display:flex;justify-content:space-between;align-items:center}
h2.bad{color:var(--bad)}
.card{background:var(--card);border-radius:14px;box-shadow:var(--sh);border:1px solid var(--line);overflow:hidden}
.row{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .ic{font-size:20px;width:26px;text-align:center;flex:none}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tm{font-variant-numeric:tabular-nums;font-weight:600;color:var(--pri);flex:none;min-width:46px;text-align:right;font-size:14px}
.row.done .t{text-decoration:line-through;color:var(--mut)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);background:none;flex:none;display:grid;place-items:center;color:#fff;font-size:15px;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok)}
.pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--pri2);color:var(--pri);margin-left:6px;vertical-align:middle}
.pill.alta{background:#fde7e6;color:var(--bad)}
.pill.late{background:#fde7e6;color:var(--bad)}
@media (prefers-color-scheme:dark){.pill.alta,.pill.late{background:#4a2321}}
.callbtn{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;text-decoration:none;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-size:24px;color:var(--pri)}
.stat span{font-size:12px;color:var(--mut)}
.empty{padding:22px 14px;text-align:center;color:var(--mut);font-size:14px}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.bar .in{display:flex;width:100%;max-width:640px}
nav.bar button{flex:1;background:none;border:0;padding:8px 0 7px;color:var(--mut);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav.bar button i{font-style:normal;font-size:21px}
nav.bar button.on{color:var(--pri);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;border:0;font-size:32px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:21}
.strip{display:flex;gap:6px;margin:12px 0 4px}
.strip button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 0;font:inherit;color:var(--tx);position:relative}
.strip button small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase}
.strip button b{font-size:17px}
.strip button.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.strip button.sel small{color:#dbe8f7}
.strip button.td:not(.sel){border-color:var(--acc)}
.strip button .dot{position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc)}
.wk{display:flex;gap:8px;align-items:center;justify-content:space-between}
.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;background:var(--pri);color:#fff}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.bad{background:#fde7e6;color:var(--bad)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:10px}
.seg{display:flex;background:var(--pri2);border-radius:12px;padding:3px;margin:12px 0 4px}
.seg button{flex:1;border:0;background:none;padding:8px 2px;border-radius:10px;font:inherit;font-size:14px;color:var(--pri);font-weight:600}
.seg button.on{background:var(--card);box-shadow:var(--sh)}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 2px 4px;text-transform:uppercase;letter-spacing:.04em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;transform:translateY(105%);transition:transform .22s;max-height:92%;display:flex;justify-content:center;pointer-events:none}
#sheet.open{transform:none;pointer-events:auto}
#sheet .pane{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));overflow:auto;max-height:92vh}
#sheet h3{margin:0 0 4px;font-size:19px}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:110px;text-align:center}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.qa button{background:var(--pri2);color:var(--pri);border:0;border-radius:14px;padding:18px 8px;font:inherit;font-weight:700;font-size:15px}
.qa button i{display:block;font-style:normal;font-size:28px;margin-bottom:4px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:#17212e;color:#fff;padding:11px 16px;border-radius:12px;z-index:50;transition:transform .25s;max-width:90%;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#toast.show{transform:translate(-50%,0)}
.note{font-size:13px;color:var(--mut);margin:6px 2px}
.set{padding:14px}
.set + .set{border-top:1px solid var(--line)}
.set h4{margin:0 0 4px}
a.lnk{color:var(--pri);font-weight:600;text-decoration:none}
header.top p{text-transform:none}header.top p::first-letter{text-transform:uppercase}
.fab.mic{right:84px;background:var(--pri);font-size:26px}
.micbig{width:88px;height:88px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:40px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.micbig.on{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,48,44,.5)}70%{box-shadow:0 0 0 22px rgba(201,48,44,0)}100%{box-shadow:0 0 0 0 rgba(201,48,44,0)}}
.vbox{display:none;margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--pri2);font-size:15px}
.vbox.reply{background:var(--bg);border:1px solid var(--line);font-size:16px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 11px;font:inherit;font-size:13px}
.tg{display:flex;align-items:center;gap:10px;margin:8px 0}
.tg input{width:22px;height:22px;flex:none}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
html[data-theme="light"]{--bg:#f3f5f8;--card:#fff;--tx:#17212e;--mut:#667385;--line:#e1e6ed;--pri:#1d4e89;--pri2:#e5eef9;--acc:#e87722;--ok:#2e8b57;--bad:#c9302c;--warn:#b7791f;--sh:0 1px 3px rgba(20,40,70,.08)}
html[data-theme="dark"]{--bg:#10151c;--card:#1a222d;--tx:#e8edf3;--mut:#93a1b3;--line:#2a3441;--pri:#5b9bdc;--pri2:#1e2f45;--acc:#f0903f;--ok:#4cc38a;--bad:#ef6a65;--warn:#e0b050;--sh:none}
html[data-theme="sun"]{--bg:#fff;--card:#fff;--tx:#000;--mut:#2b2b2b;--line:#222;--pri:#0a3a8a;--pri2:#dbe6fb;--acc:#b34700;--ok:#0b6b2c;--bad:#b00000;--warn:#8a5a00;--sh:none}
html[data-theme="sun"] .card,html[data-theme="sun"] .stat,html[data-theme="sun"] input,html[data-theme="sun"] select,html[data-theme="sun"] textarea{border:2px solid #222}
html[data-theme="sun"] .btn{border:2px solid #000;font-weight:800}
html[data-theme="sun"] body{font-weight:600}
.sigpad{width:100%;height:150px;border:2px dashed var(--mut);border-radius:12px;background:#fff;touch-action:none;display:block}
.brand{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--acc);margin-bottom:2px}
@media (min-width:900px){#app{max-width:760px}.fab{right:calc(50% - 364px)}.fab.mic{right:calc(50% - 296px)}}

.seg{overflow-x:auto;gap:2px;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{flex:none;padding:8px 11px;white-space:nowrap}
.phgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}.ph{padding:0;border:0;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--pri2)}.ph img{width:100%;height:100%;object-fit:cover;display:block}
#lock{position:fixed;inset:0;z-index:300;background:var(--bg);display:none;align-items:center;justify-content:center;text-align:center}
.lk{width:min(320px,90vw)}.lkdots{display:flex;gap:14px;justify-content:center;margin:6px 0 18px}.lkdots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri)}.lkdots i.on{background:var(--pri)}
.lkpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lkpad button{height:62px;border-radius:50%;border:0;background:var(--card);color:var(--tx);font:inherit;font-size:24px;box-shadow:var(--sh);border:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab mic" id="mic" aria-label="Hablar con Rita">🎙️</button>
<button class="fab" id="fab" aria-label="Añadir">+</button>
<nav class="bar"><div class="in" id="nav"></div></nav>
<div id="back"></div>
<div id="sheet"><div class="pane" id="pane"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ======== Datos ======== */
const KEY = 'secretaria_v1';
function blank(){ return {events:[],tasks:[],clients:[],notes:[],jobs:[],expenses:[],shop:[],quotes:[],catalog:[],suppliers:[],notified:{},settings:{name:'Iván',remind:15,hourStart:'09:00',voiceOut:true,speakReminders:true,rate:1,lastBackup:'',brief:true,briefTime:'08:00',hourRate:0,quoteUrl:'',weekly:true,timer:null,syncNudgeOff:false,lastUpdCheck:0,tpl:null,qMargin:30,qLabor:0,qTravel:0,qNotes:'Presupuesto válido 30 días.',bizName:'',bizPhone:'',bizNif:'',theme:'auto',zoom:100,ivaPct:21,ivaIncl:true,home:'Renedo de Piélagos',gemKey:'',gemModel:'gemini-3.8-flash',icon:null,wx:null,gToken:'',gId:'',gKey:'',gLast:0,ntfy:false,ntfyTopic:'',ntfyHide:false,ntfyMap:{}}}; }
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d && d.events){ d.settings = Object.assign(blank().settings, d.settings||{}); d.notified = d.notified||{}; d.notes = d.notes||[]; d.jobs = d.jobs||[]; d.expenses = d.expenses||[]; d.shop = d.shop||[]; d.quotes = d.quotes||[]; d.catalog = d.catalog||[]; d.suppliers = d.suppliers||[]; return d; }
  }catch(e){}
  return blank();
}
let S = load();
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} if(typeof idbMirror==='function') idbMirror(); }
function save(){ const ch = stamp(); persist(); if(ch && typeof afterSave==='function') afterSave(); }

/* ======== Utilidades ======== */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => iso(new Date());
const parse = (s,t) => { const [y,m,d]=s.split('-').map(Number); const [h,mi]=(t||'00:00').split(':').map(Number); return new Date(y,m-1,d,h,mi); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS3 = ['dom','lun','mar','mié','jue','vie','sáb'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const longDate = s => { const d=parse(s); return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]; };
const shortDate = s => { const d=parse(s); return DIAS3[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()].slice(0,3); };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = id => { const e=document.getElementById(id); return e ? e.value : ''; };
const client = id => S.clients.find(c => c.id===id);
function relDay(s){
  const t = today();
  if(s===t) return 'hoy';
  if(s===addDays(t,1)) return 'mañana';
  if(s===addDays(t,-1)) return 'ayer';
  return shortDate(s);
}
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),3200);
}
function telNum(p){ return String(p||'').replace(/[^\d+]/g,''); }
function waNum(p){ let n=String(p||'').replace(/\D/g,''); if(n.length===9) n='34'+n; return n; }
function mapsUrl(q){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q); }

/* ======== Estado de la interfaz ======== */
let tab = 'hoy';
let selDate = today();
let taskTab = 'pend';
let clientQ = '';

/* ======== Consultas ======== */
function dayItems(date){
  const a = [];
  S.events.filter(e=>e.date===date).forEach(e=>a.push({k:'ev',o:e,t:e.time||''}));
  S.tasks.filter(t=>t.due===date).forEach(t=>a.push({k:t.kind==='llamada'?'ll':'ta',o:t,t:t.time||''}));
  a.sort((x,y)=>(x.o.done?1:0)-(y.o.done?1:0) || (x.t||'99:99').localeCompare(y.t||'99:99'));
  return a;
}
const overdue = () => S.tasks.filter(t=>!t.done && t.due && t.due<today()).sort((a,b)=>a.due.localeCompare(b.due));
const undated = () => S.tasks.filter(t=>!t.done && !t.due);

/* ======== Pintado ======== */
function rowHtml(it){
  const o = it.o, cl = client(o.clientId);
  const icon = it.k==='ev'?'📅':it.k==='ll'?'📞':'📝';
  let sub = [];
  if(cl) sub.push(cl.name);
  if(it.k==='ev' && o.place) sub.push(o.place);
  if(it.k!=='ev' && o.notes) sub.push(o.notes);
  const check = it.k==='ev' ? `<span class="ic">${icon}</span>` :
    `<button class="chk ${o.done?'on':''}" onclick="event.stopPropagation();toggleTask('${o.id}')">${o.done?'✓':''}</button>`;
  const pill = (it.k!=='ev' && o.prio==='alta') ? '<span class="pill alta">URGENTE</span>' : '';
  const rep = (o.repeat && o.repeat!=='no') ? ' 🔁' : '';
  const call = (it.k==='ll' && cl && cl.phone && !o.done) ? `<a class="callbtn" href="tel:${esc(telNum(cl.phone))}" onclick="event.stopPropagation()">📞</a>` : '';
  const tm = it.t ? `<div class="tm">${esc(it.t)}</div>` : '';
  const go = it.k==='ev' ? `evForm('${o.id}')` : `taskForm('${o.id}')`;
  return `<div class="row ${o.done?'done':''}" onclick="${go}">${check}<div class="mid"><div class="t">${it.k==='ll' && !/^llam/i.test(o.title)?'Llamar: ':''}${esc(o.title)}${pill}${rep}</div><div class="s">${esc(sub.join(' · '))||'&nbsp;'}</div></div>${tm}${call}</div>`;
}
function taskRow(t){
  const cl = client(t.clientId);
  const late = t.due && !t.done && t.due < today();
  const dueTxt = t.due ? ' · '+(late?'<b style="color:var(--bad)">venció '+relDay(t.due)+'</b>':relDay(t.due))+(t.time?' '+t.time:'') : '';
  const call = (t.kind==='llamada' && cl && cl.phone && !t.done) ? `<a class="callbtn" href="tel:${esc(telNum(cl.phone))}" onclick="event.stopPropagation()">📞</a>` : '';
  const pill = t.prio==='alta' ? '<span class="pill alta">URGENTE</span>' : '';
  const rep = (t.repeat && t.repeat!=='no') ? ' 🔁' : '';
  return `<div class="row ${t.done?'done':''}" onclick="taskForm('${t.id}')"><button class="chk ${t.done?'on':''}" onclick="event.stopPropagation();toggleTask('${t.id}')">${t.done?'✓':''}</button><div class="mid"><div class="t">${t.kind==='llamada'?'📞 ':''}${esc(t.title)}${pill}${rep}</div><div class="s">${esc(cl?cl.name:'')}${dueTxt}</div></div>${call}</div>`;
}
function list(html, empty){ return `<div class="card">${html||`<div class="empty">${empty}</div>`}</div>`; }

function saludo(){
  const h = new Date().getHours();
  const s = h<13 ? 'Buenos días' : h<21 ? 'Buenas tardes' : 'Buenas noches';
  return s + (S.settings.name ? ', '+S.settings.name : '');
}

function viewHoy(){
  const t = today(), tm = addDays(t,1);
  const items = dayItems(t), next = dayItems(tm).filter(i=>!i.o.done);
  const od = overdue(), un = undated();
  const nEv = items.filter(i=>i.k==='ev').length;
  const nTa = items.filter(i=>i.k==='ta'&&!i.o.done).length + od.filter(x=>x.kind!=='llamada').length;
  const nLl = items.filter(i=>i.k==='ll'&&!i.o.done).length + od.filter(x=>x.kind==='llamada').length + un.filter(x=>x.kind==='llamada').length;
  let h = `<header class="top"><div class="hd"><div><div class="brand">🎙 Rita · tu asistente personal${syncBadge()}</div><h1>${esc(saludo())}</h1><p>${longDate(t)}</p></div><div style="display:flex;gap:6px"><button class="btn sec sm" onclick="openSearch()">🔍</button><button class="btn sec sm" onclick="openVoice('resumen del día')">🔊 Resumen</button></div></div></header>
  <div class="stats"><div class="stat"><b>${nEv}</b><span>citas hoy</span></div><div class="stat"><b>${nTa}</b><span>tareas</span></div><div class="stat"><b>${nLl}</b><span>llamadas</span></div></div>`;
  h += updBanner();
  h += syncNudge();
  h += wxLine();
  h += timerCard();
  h += routeCard(today());
  h += moneyCard();
  h += backupNag();
  if(od.length) h += `<h2 class="bad">⚠ Vencido (${od.length})</h2>` + list(od.map(taskRow).join(''));
  h += `<h2>Hoy</h2>` + list(items.map(rowHtml).join(''), 'Nada programado para hoy. Día despejado 👌');
  h += `<h2>Mañana <span style="text-transform:none;letter-spacing:0">${next.length} ${next.length===1?'cosa':'cosas'}</span></h2>` + list(next.map(rowHtml).join(''), 'Nada programado para mañana.');
  if(un.length) h += `<h2>Sin fecha (${un.length})</h2>` + list(un.slice(0,6).map(taskRow).join('')) + (un.length>6?`<p class="note">…y ${un.length-6} más en la pestaña Tareas.</p>`:'');
  return h;
}

function viewAgenda(){
  const d = parse(selDate);
  const mon = addDays(selDate, -((d.getDay()+6)%7));
  let strip = '';
  for(let i=0;i<7;i++){
    const day = addDays(mon,i), dd = parse(day);
    const has = S.events.some(e=>e.date===day) || S.tasks.some(t=>t.due===day && !t.done);
    strip += `<button class="${day===selDate?'sel':''} ${day===today()?'td':''}" onclick="selDate='${day}';render()"><small>${DIAS3[dd.getDay()]}</small><b>${dd.getDate()}</b>${has?'<span class="dot"></span>':''}</button>`;
  }
  const items = dayItems(selDate);
  return `<header class="top"><h1>Agenda</h1><p>${longDate(selDate)}</p></header>
  <div class="wk"><button class="btn sec sm" onclick="selDate=addDays(selDate,-7);render()">‹ Semana</button><button class="btn sec sm" onclick="selDate=today();render()">Hoy</button><button class="btn sec sm" onclick="selDate=addDays(selDate,7);render()">Semana ›</button></div>
  <div class="strip">${strip}</div>
  <h2>${relDay(selDate)==='hoy'?'Hoy':esc(longDate(selDate))}</h2>` +
  list(items.map(rowHtml).join(''), 'Sin nada este día.') +
  `${routeCard(selDate)}<div class="acts"><button class="btn sec" onclick="evForm(null,{date:'${selDate}'})">+ Cita este día</button><button class="btn sec" onclick="taskForm(null,{due:'${selDate}'})">+ Tarea este día</button></div>`;
}

function viewTareas(){
  const seg = (k,l)=>`<button class="${taskTab===k?'on':''}" onclick="taskTab='${k}';render()">${l}</button>`;
  const head = `<header class="top"><h1>Tareas y llamadas</h1><p>Lo que queda por hacer</p></header>
  <div class="seg">${seg('pend','Tareas')}${seg('ll','Llamadas')}${seg('notas','Notas')}${seg('hechas','Hechas')}</div>
  <div style="height:8px"></div>`;
  if(taskTab==='notas'){
    const rows = S.notes.map(n=>`<div class="row" onclick="noteForm('${n.id}')"><span class="ic">🗒️</span><div class="mid"><div class="t" style="white-space:normal;font-weight:500">${esc(n.text)}</div><div class="s">${new Date(n.ts).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</div></div></div>`).join('');
    return head + list(rows, 'Sin notas. Di «anota: …» o pulsa + para añadir una.');
  }
  let ts;
  if(taskTab==='pend') ts = S.tasks.filter(t=>!t.done && t.kind!=='llamada');
  else if(taskTab==='ll') ts = S.tasks.filter(t=>!t.done && t.kind==='llamada');
  else ts = S.tasks.filter(t=>t.done).slice().reverse().slice(0,60);
  if(taskTab!=='hechas') ts.sort((a,b)=>((a.due||'9999').localeCompare(b.due||'9999')) || ((a.prio==='alta'?0:1)-(b.prio==='alta'?0:1)) || (a.time||'').localeCompare(b.time||''));
  const empties = {pend:'No tienes tareas pendientes. 🎉', ll:'No tienes llamadas pendientes.', hechas:'Todavía no has completado nada.'};
  return head + list(ts.map(taskRow).join(''), empties[taskTab]) +
  (taskTab==='hechas' && ts.length ? `<div class="acts"><button class="btn bad sm" onclick="clearDone()">Borrar hechas</button></div>` : '');
}

function viewClientesList(noHead){

  const cs = S.clients.filter(c => !q || (c.name+' '+(c.phone||'')+' '+(c.address||'')).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'es'));
  const rows = cs.map(c=>`<div class="row" onclick="clientView('${c.id}')"><span class="ic">👤</span><div class="mid"><div class="t">${esc(c.name)}</div><div class="s">${esc([c.phone,c.address].filter(Boolean).join(' · '))||'&nbsp;'}</div></div>${c.phone?`<a class="callbtn" href="tel:${esc(telNum(c.phone))}" onclick="event.stopPropagation()">📞</a>`:''}</div>`).join('');
  return `${noHead ? '<div class="note" style="margin:8px 2px 0">'+S.clients.length+' guardados</div>' : '<header class="top"><h1>Clientes</h1><p>'+S.clients.length+' guardados</p></header>'}
  <div style="margin:10px 0"><input id="cq" placeholder="Buscar nombre, teléfono, dirección…" value="${esc(clientQ)}" oninput="clientQ=this.value;renderKeep()"></div>` +
  list(rows, S.clients.length?'Sin resultados.':'Aún no hay clientes. Pulsa + para añadir el primero.');
}

  $('#nav').innerHTML = TABS.map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}</button>`).join('');
  const v = {hoy:viewHoy,agenda:viewAgenda,tareas:viewTareas,clientes:viewClientes,ajustes:viewAjustes}[tab];

function renderKeep(){ // para la búsqueda: no perder el foco

function swapKind(k){
  // conserva lo escrito y redibuja el formulario con el otro tipo
  const keep = {kind:k, title:val('f_title'), clientId:val('f_client'), due:val('f_due'), time:val('f_time'), prio:val('f_prio'), repeat:val('f_repeat'), remind:val('f_remind'), notes:val('f_notes')};
  taskForm(null, keep);
}
function saveTask(id){
  const title = val('f_title').trim();
  if(!title) return toast('Ponle un título');
  const old = id ? S.tasks.find(x=>x.id===id) : null;
  const o = {id:id||uid(), kind:val('f_kind'), title, clientId:val('f_client'), due:val('f_due'), time:val('f_time'), prio:val('f_prio'), repeat:val('f_repeat'), remind:val('f_remind'), notes:val('f_notes').trim(), done:old?old.done:false};
  if(id){ S.tasks = S.tasks.map(x=>x.id===id?o:x); } else S.tasks.push(o);
  save(); closeSheet(); render(); toast(o.kind==='llamada'?'Llamada guardada':'Tarea guardada');
}
function delTask(id){ if(!confirm('¿Borrar?')) return; S.tasks=S.tasks.filter(x=>x.id!==id); save(); closeSheet(); render(); }

function nextDue(d, rep){
  const t = today(); const x = parse(d);
  let guard = 0;
  do{
    if(rep==='diaria') x.setDate(x.getDate()+1);
    else if(rep==='semanal') x.setDate(x.getDate()+7);
    else if(rep==='mensual') x.setMonth(x.getMonth()+1);
    else x.setFullYear(x.getFullYear()+1);
    guard++;
  } while(iso(x) <= t && guard < 800);
  return iso(x);
}
function toggleTask(id){
  const t = S.tasks.find(x=>x.id===id); if(!t) return;
  if(!t.done && t.repeat && t.repeat!=='no' && t.due){
    t.due = nextDue(t.due, t.repeat);
    toast('Hecho ✔ Próxima: '+shortDate(t.due));
  } else {
    t.done = !t.done;
    if(t.done) toast('Hecho ✔');
  }
  save(); render();
}
function clearDone(){ if(!confirm('¿Borrar todas las tareas hechas?')) return; S.tasks=S.tasks.filter(t=>!t.done); save(); render(); }

function delClient(id){
  if(!confirm('¿Borrar este cliente? Sus citas y tareas se conservan.')) return;
  S.clients=S.clients.filter(x=>x.id!==id);
  S.events.forEach(e=>{ if(e.clientId===id) e.clientId=''; }); S.tasks.forEach(t=>{ if(t.clientId===id) t.clientId=''; });
  save(); closeSheet(); render();

/* ======== Calendario (.ics) ======== */
function icsDate(d){ return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00'; }
function icsDay(s){ return s.replace(/-/g,''); }
function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsBlock(kind, o){
  const cl = client(o.clientId);
  const desc = [cl?('Cliente: '+cl.name+(cl.phone?' '+cl.phone:'')):'', o.notes].filter(Boolean).join('\n');
  const L = ['BEGIN:VEVENT','UID:'+o.id+'@secretaria','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'')];
  const date = kind==='ev' ? o.date : o.due, time = o.time;
  if(time){
    const st = parse(date,time), en = new Date(st.getTime()+((kind==='ev'?o.dur:30)||60)*60000);
    L.push('DTSTART:'+icsDate(st),'DTEND:'+icsDate(en));
  } else {
    L.push('DTSTART;VALUE=DATE:'+icsDay(date),'DTEND;VALUE=DATE:'+icsDay(addDays(date,1)));
  }
  L.push('SUMMARY:'+icsEsc((o.kind==='llamada'?'Llamar: ':'')+o.title));
  if(kind==='ev' && o.place) L.push('LOCATION:'+icsEsc(o.place));
  if(desc) L.push('DESCRIPTION:'+icsEsc(desc));
  const rem = (o.remind===''||o.remind==null) ? null : Number(o.remind);
  if(rem!=null){
    // con hora: antes del inicio; sin hora: se cuenta desde las 9:00 del día
    let m = time ? -rem : 540 - rem;
    const trig = (m<0?'-':'')+'PT'+Math.abs(m)+'M';
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(o.title),'TRIGGER;RELATED=START:'+trig,'END:VALARM');
  }
  L.push('END:VEVENT');
  return L.join('\r\n');
}
function icsFile(blocks){ return 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Rita//ES\r\nCALSCALE:GREGORIAN\r\n'+blocks.join('\r\n')+'\r\nEND:VCALENDAR\r\n'; }
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type:type||'text/plain'}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function icsOne(kind,id){
  const o = (kind==='ev'?S.events:S.tasks).find(x=>x.id===id); if(!o) return;
  download('cita.ics', icsFile([icsBlock(kind,o)]), 'text/calendar');
  toast('Abre el archivo para añadirlo al calendario');
}
function exportAllIcs(){
  const t = today();
  const b = [...S.events.filter(e=>e.date>=t).map(e=>icsBlock('ev',e)), ...S.tasks.filter(x=>!x.done && x.due && x.due>=t).map(x=>icsBlock('ta',x))];

}

/* ======== Avisos ======== */
function fireTime(o, isEv){
  if(o.remind===''||o.remind==null) return null;
  const d = isEv ? o.date : o.due; if(!d) return null;
  return new Date(parse(d, o.time||S.settings.hourStart).getTime() - Number(o.remind)*60000);
}
async function showNotif(title, body, tag){
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(_){}
  toast('🔔 '+title+(body?' — '+body:''));
  if(S.settings.speakReminders && typeof speak==='function') speak('Aviso. '+title+'. '+(body||''), null, true);
  if(ntfyOn()) return;
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  try{
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    const opts = {body, icon:'icon-192.png', badge:'icon-192.png', tag, vibrate:[200,100,200], requireInteraction:true};
    if(reg) reg.showNotification(title, opts); else new Notification(title, opts);
  }catch(_){}
}
function checkReminders(){
  const now = Date.now(); let changed = false;
  const all = [...S.events.map(o=>[o,true]), ...S.tasks.filter(t=>!t.done).map(o=>[o,false])];
  for(const [o,isEv] of all){
    const f = fireTime(o,isEv); if(!f) continue;
    const key = o.id+'@'+f.getTime(), age = now - f.getTime();
    if(age<0 || S.notified[key]) continue;
    S.notified[key] = now; changed = true;
    if(age > 6*3600e3) continue; // demasiado viejo: no molestar
    if(isEv){ const st = parse(o.date,o.time||'00:00').getTime(); if(o.time && now > st + (o.dur||60)*60000) continue; }
    const cl = client(o.clientId);
    const when = o.time ? 'a las '+o.time : relDay(isEv?o.date:o.due);
    const icon = isEv ? '📅' : o.kind==='llamada' ? '📞' : '📝';
    const title = icon+' '+(o.kind==='llamada'?'Llamar: ':'')+o.title;
    const body = [when, cl&&cl.name, isEv&&o.place].filter(Boolean).join(' · ');
    showNotif(title, body, key);
  }
  // limpieza de registros antiguos (>30 días)
  for(const k of Object.keys(S.notified)){ if(now - S.notified[k] > 30*864e5){ delete S.notified[k]; changed = true; } }
  if(changed) save();
}

const COLS = ['events','tasks','clients','notes','jobs','expenses','shop','quotes','catalog','suppliers'];
const hhmm = ts => new Date(ts||Date.now()).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});

// Marca cada elemento cambiado con su fecha (u) y anota los borrados (del): permite fusionar sin perder nada.
function stamp(){
  const now = Date.now(); S.h = S.h || {}; S.del = S.del || {};
  const seen = {}; let changed = false;
  for(const k of COLS) for(const o of S[k]){
    const {u, ...rest} = o; const sg = JSON.stringify(rest); seen[o.id] = 1;
    if(S.h[o.id] !== sg){ o.u = now; S.h[o.id] = sg; changed = true; }
    if(S.del[o.id]) delete S.del[o.id];
  }
  for(const id of Object.keys(S.h)) if(!seen[id]){ S.del[id] = now; delete S.h[id]; changed = true; }
  for(const id of Object.keys(S.del)) if(now - S.del[id] > 90*864e5) delete S.del[id];
  return changed;
}

async function idbRestore(){
  if(S.events.length || S.tasks.length || S.clients.length || S.notes.length) return;
  try{
    const db = await idbOpen();
    const v = await new Promise((res,rej)=>{ const q = db.transaction('kv').objectStore('kv').get('state'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    if(!v) return;
    const d = JSON.parse(v);

/* ======== SINCRONIZACIÓN (GitHub Gist, cifrado) ======== */
const GURL = 'https://api.github.com/gists';
let syncing = false, syncT = null, syncMsg = '', syncAgain = false, syncDirty = false, changeSeq = 0, gistEtag = '', syncState = 'off';
const te = new TextEncoder(), td = new TextDecoder();
function b64(buf){ const a = new Uint8Array(buf); let s = ''; for(let i=0;i<a.length;i+=0x8000) s += String.fromCharCode.apply(null, a.subarray(i,i+0x8000)); return btoa(s); }
function unb64(s){ const b = atob(s), a = new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i] = b.charCodeAt(i); return a; }
async function dkey(pass, salt){
  const km = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encPayload(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await dkey(pass, salt);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, te.encode(JSON.stringify(obj)));
  return JSON.stringify({v:1, s:b64(salt), i:b64(iv), c:b64(ct)});
}
async function decPayload(txt, pass){
  const j = JSON.parse(txt); const key = await dkey(pass, unb64(j.s));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(j.i)}, key, unb64(j.c));
  return JSON.parse(td.decode(pt));
}
const canCrypto = () => !!(window.crypto && crypto.subtle);
function sharedState(){ const o = {v:3, del:S.del||{}}; COLS.forEach(k => o[k] = S[k]); return o; }
function sigState(o){
  return COLS.map(k => (o[k]||[]).map(x => x.id+':'+(x.u||0)).sort().join(',')).join('|') + '#' + Object.entries(o.del||{}).map(([i,t]) => i+':'+t).sort().join(',');
}
function mergeRemote(R){
  const del = Object.assign({}, R.del||{});
  for(const [id,t] of Object.entries(S.del||{})) if(!(del[id] > t)) del[id] = t;
  for(const k of COLS){
    const map = {};
    for(const o of (R[k]||[])) map[o.id] = o;
    for(const o of S[k]){ const r = map[o.id]; if(!r || (o.u||0) > (r.u||0)) map[o.id] = o; }
    const out = [];
    for(const id of Object.keys(map)){ const o = map[id]; if(del[id] && del[id] >= (o.u||0)) continue; out.push(o); }
    if(k==='notes') out.sort((a,b)=>(b.ts||0)-(a.ts||0));
    S[k] = out;
  }
  S.del = del; S.h = {};
  for(const k of COLS) for(const o of S[k]){ const {u, ...rest} = o; S.h[o.id] = JSON.stringify(rest); }
}
function setSyncMsg(t){
  syncMsg = t; const e = $('#sync_msg'); if(e) e.textContent = t;
  syncState = /^⚠/.test(t) ? 'err' : /^Sincronizando/.test(t) ? 'busy' : /^Sincronizado/.test(t) ? 'ok' : syncState; paintBadge();
}
async function syncNow(manual){
  const st = S.settings;
  if(!st.gToken || !st.gId || !st.gKey){ if(manual) toast('La sincronización no está activada'); return false; }
  if(!canCrypto()){ setSyncMsg('⚠ Este navegador no permite cifrar desde aquí. Abre la app desde una dirección https.'); return false; }
  if(syncing){ syncAgain = true; return false; }
  syncing = true; const seq = changeSeq;
  if(manual || syncDirty) setSyncMsg('Sincronizando…');
  try{
    const H = {Authorization:'Bearer '+st.gToken, Accept:'application/vnd.github+json'};
    const hdr = Object.assign({}, H); if(gistEtag && !manual && !syncDirty) hdr['If-None-Match'] = gistEtag;
    const r = await fetch(GURL+'/'+st.gId, {headers:hdr, cache:'no-store'});
    if(r.status===304){ st.gLast = Date.now(); persist(); setSyncMsg('Sincronizado a las '+hhmm()); return true; }
    if(r.status===401 || r.status===403) throw new Error('GitHub no acepta el token (¿caducó?). Desactiva y vuelve a configurar la sincronización.');
    if(r.status===404) throw new Error('No encuentro la copia en GitHub.');
    if(!r.ok) throw new Error('GitHub respondió '+r.status+'.');
    gistEtag = r.headers.get('etag') || '';
    const j = await r.json(); const f = j.files && j.files['secretaria.dat'];
    let remote = null;
    if(f){
      const txt = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
      if(txt && txt.trim()){
        try{ remote = await decPayload(txt, st.gKey); }
        catch(e){ throw new Error('No puedo descifrar la copia: el código de enlace no coincide.'); }
      }
    }
    let changed = false;
    if(remote){ const before = sigState(sharedState()); mergeRemote(remote); changed = before !== sigState(sharedState()); }
    const need = !remote || sigState(sharedState()) !== sigState(remote);
    if(changed){ persist(); render(); if(typeof syncNtfy === 'function') syncNtfy(); }
    if(need){
      const body = await encPayload(sharedState(), st.gKey);
      const pr = await fetch(GURL+'/'+st.gId, {method:'PATCH', headers:Object.assign({'Content-Type':'application/json'}, H), body:JSON.stringify({files:{'secretaria.dat':{content:body}}})});
      if(!pr.ok) throw new Error('No he podido guardar en GitHub ('+pr.status+').');
      gistEtag = pr.headers.get('etag') || '';
    }
    if(changeSeq === seq) syncDirty = false;
    st.gLast = Date.now(); persist();
    setSyncMsg('Sincronizado a las '+hhmm());
    if(manual) toast(changed ? 'Sincronizado: he traído cambios' : 'Sincronizado ✔');
    return true;
  }catch(e){
    setSyncMsg('⚠ '+(e && e.message && !/Failed to fetch|NetworkError|Load failed/i.test(e.message) ? e.message : 'Sin conexión con GitHub. Se reintentará.'));
    if(manual) toast('No se ha podido sincronizar');
    return false;
  }finally{
    syncing = false;
    if(syncAgain){ syncAgain = false; setTimeout(() => syncNow(false), 300); }
  }
}
function afterSave(){
  syncDirty = true; changeSeq++;
  clearTimeout(syncT);

async function syncCreate(){
  const token = val('g_token').trim(); if(!token) return toast('Pega el token de GitHub');
  if(!canCrypto()) return toast('Abre la app desde Chrome o una dirección https para poder cifrar');
  try{
    const key = b64(crypto.getRandomValues(new Uint8Array(18)));
    const body = await encPayload(sharedState(), key);
    const r = await fetch(GURL, {method:'POST', headers:{Authorization:'Bearer '+token, Accept:'application/vnd.github+json', 'Content-Type':'application/json'}, body:JSON.stringify({description:'Rita (copia cifrada)', public:false, files:{'secretaria.dat':{content:body}}})});
    if(r.status===401) return toast('GitHub no acepta ese token');
    if(r.status===403 || r.status===404) return toast('Ese token no tiene permiso «gist»');
    if(!r.ok) return toast('GitHub respondió '+r.status);
    const j = await r.json();
    Object.assign(S.settings, {gToken:token, gId:j.id, gKey:key, gLast:Date.now()}); persist();
    syncMsg = ''; render(); syncCodeSheet(true);
  }catch(e){ toast('No hay conexión con GitHub'); }
}

/* ======== AVISOS CON LA APP CERRADA (ntfy) ======== */
const NTFY = 'https://ntfy.sh/';
let ntfyBusy = false;
const ntfyOn = () => !!(S.settings.ntfy && S.settings.ntfyTopic);
function newTopic(){ const a = crypto.getRandomValues(new Uint8Array(12)); return 'rita-'+Array.from(a).map(x => (x%36).toString(36)).join(''); }
function ntfyUrl(id, q){ return NTFY + encodeURIComponent(S.settings.ntfyTopic) + (id ? '/'+encodeURIComponent(id) : '') + (q ? '?'+q : ''); }
async function ntfyPost(id, w){
  const q = 'title='+encodeURIComponent(w.title) + (w.at ? '&delay='+Math.floor(w.at/1000) : '') + '&priority=4&tags=alarm_clock';
  const r = await fetch(ntfyUrl(id, q), {method:'POST', headers:{'Content-Type':'text/plain; charset=utf-8'}, body:w.body || 'Aviso'});
  return r.ok;
}
async function ntfyDelete(id){
  try{ const r = await fetch(ntfyUrl(id), {method:'DELETE'}); return r.ok || r.status===404; }catch(_){ return false; }
}
function ntfyItems(){
  const now = Date.now(), maxAt = now + 71*3600e3, out = {};
  const all = [...S.events.map(o=>[o,true]), ...S.tasks.filter(t=>!t.done).map(o=>[o,false])];
  for(const [o,isEv] of all){
    const f = fireTime(o,isEv); if(!f) continue;
    const at = f.getTime(); if(at < now+20e3 || at > maxAt) continue;
    const cl = client(o.clientId), hide = S.settings.ntfyHide;

async function syncNtfy(){
  if(!ntfyOn() || ntfyBusy || navigator.onLine === false) return;
  ntfyBusy = true;
  try{
    const want = ntfyItems(), have = S.settings.ntfyMap || {}, next = Object.assign({}, have);
    let calls = 0;
    for(const id of Object.keys(have)){
      if(want[id]) continue;
      if(have[id].at < Date.now()-60e3){ delete next[id]; continue; }
      if(calls++ >= 40) break;
      if(await ntfyDelete(id)) delete next[id];
      await sleep(120);
    }
    for(const [id,w] of Object.entries(want)){
      if(have[id] && have[id].sig === w.sig) continue;
      if(calls++ >= 40) break;
      try{ if(await ntfyPost(id, w)) next[id] = {at:w.at, sig:w.sig}; }catch(_){}
      await sleep(120);
    }
    S.settings.ntfyMap = next; persist();
    const e = $('#ntfy_cnt'); if(e) e.textContent = Object.keys(next).length;
  }catch(_){}
  finally{ ntfyBusy = false; }
}

const NUMW = {cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiuno:21,veintiuna:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,cincuenta:50};
const NUMK = Object.keys(NUMW).sort((a,b)=>b.length-a.length).join('|');
const NUMN = '(?:\\d{1,2}|'+NUMK+')';
const toN = x => /^\d/.test(x) ? parseInt(x,10) : NUMW[x];
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOW = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
const STOPW = new Set(['de','la','el','los','las','lo','que','con','para','por','una','uno','del','hecho','hecha','hacer','llamar','llamado','llamada','llame','cita','tarea','nota','mis','esa','ese','eso','esto','como','ya','he','hice','mi','sus','hay','tengo']);
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

function fold(s){
  return String(s).toLowerCase()
    .replace(/[áàäâ]/g,'a').replace(/[éèëê]/g,'e').replace(/[íìïî]/g,'i').replace(/[óòöô]/g,'o').replace(/[úùüû]/g,'u').replace(/ñ/g,'n')
    .replace(/(\d)\.(\d)/g,'$1:$2').replace(/(\d),(\d)/g,'$1_$2').replace(/[¿?¡!;,.]/g,' ');
}
function mk(raw){
  const c = {o:String(raw).replace(/[¿?¡!]/g,' ')};
  c.f = fold(c.o);
  c.cut = m => { c.o = c.o.slice(0,m.index)+' '+c.o.slice(m.index+m[0].length); c.f = c.f.slice(0,m.index)+' '+c.f.slice(m.index+m[0].length); };
  c.take = re => { const m = re.exec(c.f); if(m) c.cut(m); return m; };
  c.takeAll = re => { let n=0; while(n++<12 && c.take(re)); };
  return c;
}
function cleanTitle(s){

  do{ prev=s; s = s.replace(/\s+(?:que|para|de|del|a|al|y|con|en|el|la|por)$/i,''); }while(s!==prev);

/* --- hora y fecha en lenguaje natural --- */
function parseTime(c, loose){
  let m;
  if((m = c.take(/\b(?:al|a) mediodia\b/))) return '12:00';
  const pre = loose ? '(?:(?:a|para|sobre|hacia)\\s+)?(?:(?:las|la)\\s+)?' : '(?:a|para|sobre|hacia)\\s+(?:las|la)\\s+';
  const re = new RegExp('\\b'+pre+'('+NUMN+')(?::(\\d{2}))?(?: y (media|cuarto|'+NUMN+')| menos (cuarto|'+NUMN+'))?(?: en punto)?(?: de la (manana|tarde|noche|madrugada)| (am|pm)| del (mediodia))?(?![\\w:])');
  m = re.exec(c.f);
  if(!m) return null;
  const h0 = toN(m[1]); if(h0>24) return null;
  c.cut(m);
  let mi = m[2] ? +m[2] : 0;
  if(m[3]) mi = m[3]==='media' ? 30 : m[3]==='cuarto' ? 15 : toN(m[3]);
  const per = m[5] || m[6] || (m[7] ? 'mediodia' : '');
  let pm;
  if(per==='tarde' || per==='noche' || per==='pm') pm = true;
  else if(per==='manana' || per==='am' || per==='madrugada') pm = false;
  else if(per==='mediodia') pm = h0 < 8;
  else pm = (h0>=1 && h0<=7);
  let h = (pm && h0<12) ? h0+12 : h0;
  if(m[4]){ const k = m[4]==='cuarto' ? 15 : toN(m[4]); h = h-1; mi = 60-k; if(h<0) h=23; }
  if(h>23 || mi>59) return null;
  return pad(h)+':'+pad(mi);
}
function parseWhen(c){
  const now = new Date(); let date = null, time = null, m;
  if((m = c.take(new RegExp('\\b(?:dentro de|en) ('+NUMN+') (horas?|minutos?)\\b')))){
    const n = toN(m[1]); const d = new Date(now.getTime() + n*(/^h/.test(m[2])?3600e3:60e3));
    return {date:iso(d), time:pad(d.getHours())+':'+pad(d.getMinutes())};
  }
  if(c.take(/\b(?:dentro de|en) media hora\b/)){ const d = new Date(now.getTime()+1800e3); return {date:iso(d), time:pad(d.getHours())+':'+pad(d.getMinutes())}; }
  time = parseTime(c);
  c.take(/\b(?:por|de|en|durante|a primera hora de) la (?:manana|tarde|noche)\b/);
  if(c.take(/\besta (?:manana|tarde|noche)\b/)) date = today();
  else if(c.take(/\bpasado manana\b/)) date = addDays(today(),2);
  else if(c.take(/\bmanana\b/)) date = addDays(today(),1);
  else if(c.take(/\bhoy\b/)) date = today();
  if(!date && (m = c.take(new RegExp('\\b(?:(?:para|de|del|el|este|esta|proximo|proxima)\\s+)*('+DOW.join('|')+')\\b')))){
    let diff = (DOW.indexOf(m[1]) - new Date().getDay() + 7) % 7; if(diff===0) diff = 7;
    date = addDays(today(), diff);
  }
  if(!date && (m = c.take(new RegExp('\\b(?:(?:para|de|del|el|dia)\\s+)*('+NUMN+') de ('+MES.join('|')+')(?: de (\\d{4}))?\\b')))){
    const dd = toN(m[1]), mm = MES.indexOf(m[2]); const yy = m[3] ? +m[3] : new Date().getFullYear();
    let d = new Date(yy,mm,dd); if(!m[3] && iso(d) < today()) d = new Date(yy+1,mm,dd);
    date = iso(d);
  }
  if(!date && (m = c.take(/\b(?:(?:para|de|del|el)\s+)*(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))){
    let yy = m[3] ? +m[3] : new Date().getFullYear(); if(yy<100) yy += 2000;
    let d = new Date(yy, +m[2]-1, +m[1]); if(!m[3] && iso(d) < today()) d = new Date(yy+1, +m[2]-1, +m[1]);
    date = iso(d);
  }
  if(!date && ((m = c.take(/\b(?:(?:para|de|del|el)\s+)*dia (\d{1,2})\b/)) || (m = c.take(/\bel (\d{1,2})\b(?! de)/)))){
    const n = new Date(); let d = new Date(n.getFullYear(), n.getMonth(), +m[1]); if(iso(d) < today()) d = new Date(n.getFullYear(), n.getMonth()+1, +m[1]);
    date = iso(d);
  }
  if(!date && (m = c.take(new RegExp('\\b(?:dentro de|en) ('+NUMN+') (dias?|semanas?|meses|mes)\\b')))){
    const n = toN(m[1]); const d = parse(today());
    if(/^d/.test(m[2])) d.setDate(d.getDate()+n); else if(/^s/.test(m[2])) d.setDate(d.getDate()+7*n); else d.setMonth(d.getMonth()+n);
    date = iso(d);
  }
  if(!date && c.take(/\b(?:la )?(?:semana que viene|proxima semana)\b/)) date = addDays(today(),7);
  if(!date && c.take(/\b(?:el )?(?:mes que viene|proximo mes)\b/)){ const d = parse(today()); d.setMonth(d.getMonth()+1); date = iso(d); }
  return {date, time};
}

/* --- clientes y elementos por nombre --- */
function findClient(c){
  let best = null, bl = 0;
  for(const cl of S.clients){
    const nf = fold(cl.name).replace(/[()]/g,' ').replace(/\s+/g,' ').trim();
    if(!nf) continue;
    if(c.f.includes(nf)){ if(nf.length > bl){ best = {cl, tok:nf}; bl = nf.length; } continue; }
    for(const tk of nf.split(' ')){
      if(tk.length>=4 && !['talleres','taller','hermanos','chalet','casa','comunidad','obras','construcciones'].includes(tk) && new RegExp('\\b'+reEsc(tk)+'\\b').test(c.f) && tk.length > bl){ best = {cl, tok:tk}; bl = tk.length; }
    }
  }
  return best;
}
function dropClient(c, cl){
  if(!cl) return;
  c.take(new RegExp('\\b(?:(?:con|para|de|a|al|en casa de|en la obra de)\\s+)?(?:(?:el|la|don|dona|cliente)\\s+)*'+reEsc(cl.tok)+'\\b'));
}
function qWords(s){ return fold(s).split(/[^a-z0-9]+/).filter(w => w.length>2 && !STOPW.has(w)); }
function pickItem(text, pool){
  const q = qWords(text); if(!q.length) return null;
  let best = null, bs = 0;
  for(const it of pool){
    const o = it.o, cl = client(o.clientId);
    const cw = qWords((o.title||o.text||'')+' '+(cl?cl.name:'')+' '+(o.place||''));
    let sc = 0;
    for(const w of q){ if(cw.some(x => x===w || (w.length>=4 && x.length>=4 && (x.startsWith(w) || w.startsWith(x))))) sc++; }
    if(sc > bs){ bs = sc; best = it; }
  }
  return best;
}

/* --- cómo suena en voz --- */
function perDay(h){ return h===12 ? 'del mediodía' : h<6 ? 'de la madrugada' : h<12 ? 'de la mañana' : h<21 ? 'de la tarde' : 'de la noche'; }
function spokenTime(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const f = x => { const k = x%12===0 ? 12 : x%12; return k===1 ? 'la una' : 'las '+k; };
  if(m===0) return f(h)+' '+perDay(h);
  if(m===15) return f(h)+' y cuarto '+perDay(h);
  if(m===30) return f(h)+' y media '+perDay(h);
  if(m===45){ const h2 = (h+1)%24; return f(h2)+' menos cuarto '+perDay(h2); }
  return f(h)+' y '+m+' '+perDay(h);
}
function spokenDay(d){
  const t = today();
  if(d===t) return 'hoy'; if(d===addDays(t,1)) return 'mañana'; if(d===addDays(t,-1)) return 'ayer';
  const x = parse(d); return 'el '+DIAS[x.getDay()]+' '+x.getDate()+' de '+MESES[x.getMonth()];
}
function itemSpeech(it){
  const o = it.o, cl = client(o.clientId);
  if(it.k==='ev') return (/^cita/i.test(o.title)?'':'cita: ')+o.title+(cl && !fold(o.title).includes(fold(cl.name).split(' ')[0]) ? ' con '+cl.name : '');
  if(it.k==='ll') return /^llam/i.test(o.title) ? o.title.charAt(0).toLowerCase()+o.title.slice(1) : 'llamar'+(cl?' a '+cl.name:'')+': '+o.title;
  return 'tarea: '+o.title;
}

/* --- salida: texto + voz --- */
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  return vs.find(v => /^es[-_]ES/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang));
}
function speak(text, done, force){
  const cb = () => { if(done){ try{ done(); }catch(_){} } };
  if(!(force || S.settings.voiceOut) || !('speechSynthesis' in window)) return setTimeout(cb, 60);
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu,'').replace(/·/g,','));
    u.lang = 'es-ES'; u.rate = +S.settings.rate || 1;
    const v = pickVoice(); if(v) u.voice = v;
    u.onend = cb; u.onerror = cb; speechSynthesis.speak(u);
  }catch(_){ cb(); }
}
function reply(text, actions){
  voiceActs = actions || [];
  const r = $('#v_reply'); if(r){ r.textContent = text; r.style.display = 'block'; }
  const ac = $('#v_actions');
  if(ac) ac.innerHTML = voiceActs.map((a,i) => a.href
    ? `<a class="btn ${a.cls||'sec'}" style="text-decoration:none" href="${esc(a.href)}" ${/^https?:/.test(a.href)?'target="_blank" rel="noopener"':''}>${a.label}</a>`
    : `<button class="btn ${a.cls||'sec'}" onclick="voiceAct(${i})">${a.label}</button>`).join('');
  speak(text, () => { if(pending && voiceOpen) startListen(); });
}
function voiceAct(i){ const a = voiceActs[i]; if(a && a.fn) a.fn(); }
function setStatus(t){ const e = $('#v_status'); if(e) e.textContent = t; }
function micState(on){ const b = $('#v_mic'); if(b) b.classList.toggle('on', on); }

/* --- escuchar --- */
function stopRec(){
  if(rec){ try{ rec.onend = rec.onerror = rec.onresult = null; rec.abort(); }catch(_){} rec = null; }
  listening = false; micState(false);
}
function startListen(){
  if(!SR){ setStatus('Este navegador no tiene reconocimiento de voz (usa Chrome). Puedes escribir la orden abajo.'); return; }
  try{ speechSynthesis.cancel(); }catch(_){}
  stopRec(); gotFinal = false;
  rec = new SR(); rec.lang = 'es-ES'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  rec.onstart = () => { listening = true; micState(true); setStatus('Te escucho…'); };
  rec.onresult = e => {
    let txt = '', fin = false;
    for(let i=e.resultIndex; i<e.results.length; i++){ txt += e.results[i][0].transcript; if(e.results[i].isFinal) fin = true; }
    const h = $('#v_heard'); if(h){ h.textContent = '🗣 '+txt; h.style.display = 'block'; }
    if(fin && !gotFinal){ gotFinal = true; runCmd(txt); }
  };
  rec.onerror = e => {
    listening = false; micState(false);
    const msgs = {'not-allowed':'No tengo permiso para usar el micrófono. Actívalo en el candado de la barra de direcciones. Mientras tanto puedes escribir.',
      'service-not-allowed':'El navegador no deja usar el micrófono aquí. Puedes escribir la orden.',
      'no-speech':'No te he oído. Pulsa el micrófono y vuelve a intentarlo.',
      'audio-capture':'No encuentro ningún micrófono.',
      'network':'El reconocimiento de voz necesita conexión a internet.'};
    if(e.error !== 'aborted') setStatus(msgs[e.error] || ('Error de voz: '+e.error));
  };
  rec.onend = () => { listening = false; micState(false); const s = $('#v_status'); if(s && s.textContent==='Te escucho…') s.textContent = 'Pulsa el micrófono para hablar.'; };
  try{ rec.start(); }catch(e){ setStatus('No he podido iniciar el micrófono.'); }
}
function toggleListen(){ if(listening){ stopRec(); setStatus('Pulsa el micrófono para hablar.'); } else startListen(); }
function stopVoice(){ voiceOpen = false; pending = null; stopRec(); try{ speechSynthesis.cancel(); }catch(_){} }

function handlePending(c){
  const p = pending, F = c.f.trim();
  if(/^(?:cancela|cancelar|olvidalo|dejalo|nada|no importa|no quiero)\b/.test(F)){ pending = null; return reply('Vale, lo dejo.'); }
  if(p.kind==='note'){ pending = null; return saveNoteVoice(c.o.trim()); }
  if(p.kind==='tstart'){ const jb = activeJobFor(c); if(!jb) return reply('No encuentro ese trabajo. ¿Cuál es? Dime el cliente o el nombre.'); pending = null; timerStart(jb.id); return reply('Cronómetro en marcha en «'+jb.title+'». Dime «termino» cuando acabes.'); }
  if(p.kind==='exp'){ const a = parseAmount(c, true); if(a == null) return reply('No te he entendido. ¿Cuántos euros ha sido?'); p.draft.amount = a; pending = null; return finishExpense(p.draft); }
  if(p.need==='time'){
    if(/(?:sin hora|da igual|todo el dia|cualquier hora|no se)/.test(F)){ p.draft.noTime = true; pending = null; return finishEvent(p.draft); }
    const t = parseTime(c, true);
    if(t){ p.draft.time = t; pending = null; return finishEvent(p.draft); }
    return reply('No te he entendido. ¿A qué hora? Por ejemplo: a las diez y media.');
  }
  if(p.need==='date'){
    const w = parseWhen(c);
    if(w.date){ p.draft.date = w.date; if(w.time) p.draft.time = w.time; pending = null; return finishEvent(p.draft); }
    return reply('No te he entendido. ¿Qué día? Por ejemplo: mañana o el viernes.');
  }
  pending = null;
}

function mkEvent(c){
  const w = parseWhen(c);
  const cl = findClient(c); dropClient(c, cl);
  c.takeAll(/\b(?:agenda|apunta|apuntame|anota|anotame|pon|ponme|anade|crea|programa|reserva|mete|guarda|hazme|tengo|hay)\b/);
  c.takeAll(/\b(?:he quedado|quedo|quedamos|quedada)\b/);
  c.takeAll(/\b(?:(?:una|la|un|el|nueva|mi)\s+)*(?:cita|reunion)\b/);
  const rest = c.o.replace(/\s+/g,' ').trim();
  let title;
  if(!cl && /^con\s/i.test(rest)) title = 'Cita '+rest;
  else title = cap(cleanTitle(rest)) || (cl ? 'Cita con '+cl.cl.name : 'Cita');
  finishEvent({title, date:w.date||'', time:w.time||'', clientId:cl?cl.cl.id:'', place:cl?(cl.cl.address||''):'', notes:'', dur:60, remind:String(S.settings.remind)});
}
function finishEvent(d){
  if(!d.date){ pending = {kind:'ev', need:'date', draft:d}; return reply('¿Para qué día?'); }
  if(!d.time && !d.noTime){ pending = {kind:'ev', need:'time', draft:d}; return reply('¿A qué hora?'); }
  const o = Object.assign({id:uid()}, d); delete o.noTime;
  const cf = conflicts(o);
  S.events.push(o); save(); selDate = o.date; render();
  lastAction = {undo(){ S.events = S.events.filter(x=>x.id!==o.id); save(); render(); }};
  const cl = client(o.clientId);
  let s = 'Hecho. '+(/^cita/i.test(o.title)?'':'Cita'+(cl?' con '+cl.name:'')+': ')+o.title+', '+spokenDay(o.date)+(o.time?' a '+spokenTime(o.time):'')+'.';
  if(cf.length) s += ' Ojo: a esa hora ya tenías '+cf[0].title+'.';
  reply(s, [{label:'↩ Deshacer', fn:undo}]);
}

function mkTask(c){
  let repeat0 = 'no', rm;
  if((rm = c.take(new RegExp('\\b(?:todos|cada) (?:los )?('+DOW.join('|')+')\\b')))){ repeat0 = 'semanal'; c.o += ' el '+rm[1]; c.f += ' el '+rm[1]; }
  const w = parseWhen(c);
  const cl = findClient(c); dropClient(c, cl);
  const isCall = /\bllam(?:ar|a|ame|ale|arle|ada)\b|\btelefonear\b/.test(c.f);
  let prio = 'normal'; if(c.take(/\b(?:es )?(?:urgente|muy importante|prioritari[oa]|importante)\b/)) prio = 'alta';
  let repeat = repeat0;
  if(c.take(/\b(?:todos los dias|cada dia|a diario|diariamente)\b/)) repeat = 'diaria';
  else if(c.take(/\b(?:todas las semanas|cada semana|semanalmente)\b/)) repeat = 'semanal';
  else if(c.take(/\b(?:todos los meses|cada mes|mensualmente)\b/)) repeat = 'mensual';
  else if(c.take(/\b(?:todos los anos|cada ano|anualmente)\b/)) repeat = 'anual';
  let guard = 0, m;
  while(guard++<8 && (m = c.take(/^\s*(?:recuerdame|acuerdame|avisame|anade|apunta|apuntame|anota|anotame|pon|ponme|crea|guarda|tengo que|hay que|necesito|debo|no me dejes|tarea|recordatorio|pendiente|tengo pendiente|una|un|la|el|que|de|para|por favor|tambien)\b/)));
  let rest = c.o.replace(/\s+/g,' ').trim();
  let title;
  if(isCall){
    if(cl){ rest = rest.replace(/^(?:llamar|llama|llamarle|llamale|telefonear|llamada)\s*(?:a|al|a la)?\s*/i,'').trim(); const tail = rest.replace(/^(?:que|y|,)\s+/i,'').trim(); title = 'Llamar a '+waName(cl.cl)+(tail ? (/^(?:por|para|sobre|de|del|con|acerca|referente)\b/i.test(tail) ? ' ' : ': ')+tail : ''); }
    else title = cap(cleanTitle(rest)) || 'Llamar';
  } else title = cap(cleanTitle(rest)) || 'Tarea';
  let due = w.date || '', time = w.time || '';
  if(time && !due) due = (parse(today(), time).getTime() > Date.now()) ? today() : addDays(today(),1);
  if(repeat!=='no' && !due) due = today();
  const t = {id:uid(), kind:isCall?'llamada':'tarea', title, clientId:cl?cl.cl.id:'', due, time, prio, repeat, remind:(w.date||w.time)?'0':'', notes:'', done:false};
  S.tasks.push(t); save(); render();
  lastAction = {undo(){ S.tasks = S.tasks.filter(x=>x.id!==t.id); save(); render(); }};
  let s = 'Anotado. '+(isCall && !/^llam/i.test(title) ? 'Llamar'+(cl?' a '+cl.cl.name:'')+': ' : '')+title+(cl && !isCall ? ' ('+cl.cl.name+')' : '');
  if(due) s += ', '+spokenDay(due)+(time?' a '+spokenTime(time):'')+'.'; else s += '.';
  if(t.remind!=='') s += time ? ' Te avisaré a esa hora.' : ' Te avisaré a las nueve de la mañana.';
  if(repeat!=='no') s += ' Se repetirá '+({diaria:'cada día',semanal:'cada semana',mensual:'cada mes',anual:'cada año'})[repeat]+'.';
  reply(s, [{label:'↩ Deshacer', fn:undo}]);

/* --- divisas (Frankfurter / BCE) y cripto (CoinGecko) --- */
function fxParse(c){
  const f = c.f; const found = [];
  const re = new RegExp('\\b('+CURK+')\\b','g'); let m;
  while((m = re.exec(f))) found.push({w:m[1], i:m.index, code:CUR[m[1]]});
  if(!found.length) return null;
  const am = new RegExp('(\\d+(?:[.,]\\d+)?)\\s*('+CURK+')\\b').exec(f);
  let amount = 1, from, to;
  if(am){ amount = parseFloat(am[1].replace(',','.')); from = CUR[am[2]]; }
  else from = found[0].code;
  to = (found.map(x=>x.code).find(cd => cd !== from)) || (from === 'EUR' ? 'USD' : 'EUR');
  if(from === to) return null;
  return {amount, from, to};
}
async function doFx(c){
  const p = fxParse(c); thinking('Consultando el cambio…');
  const {ok, json} = await fetchJson('https://api.frankfurter.dev/v1/latest?base='+p.from+'&symbols='+p.to);
  const rate = ok && json && json.rates && json.rates[p.to];
  if(!rate) return reply('No he podido obtener ese cambio. Prueba con euros, dólares, libras u otra moneda habitual.');
  const nm = (k, n) => (n===1 ? CURN1[k] : CURN[k]) || CURN[k] || k;
  reply(num(p.amount, 2)+' '+nm(p.from, p.amount)+(p.amount===1?' es ':' son ')+num(p.amount*rate, 2)+' '+nm(p.to, p.amount*rate)+'. Cambio del Banco Central Europeo'+(json.date?' del '+longDate(json.date):'')+'.');
}
async function doCrypto(c){
  const k = Object.keys(COINS).find(x => new RegExp('\\b'+x+'\\b').test(c.f)) || 'bitcoin';
  const id = COINS[k][0]; thinking('Consultando la cotización…');
  const {ok, json} = await fetchJson('https://api.coingecko.com/api/v3/simple/price?ids='+id+'&vs_currencies=eur&include_24hr_change=true');

  if(!d) return reply('No he podido consultar esa criptomoneda ahora mismo.');

}

const aiHist = [];
const hasAI = () => !!S.settings.gemKey;
function gemModels(){ const m = S.settings.gemModel || 'gemini-3.8-flash'; return [m, 'gemini-flash-latest', 'gemini-2.5-flash'].filter((x,i,a) => a.indexOf(x) === i); }
async function gemCall(body, key){
  let last;
  for(const m of gemModels()){
    const r = await fetchJson('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent', {method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':key}, body:JSON.stringify(body)}, 45000);
    last = r;
    const msg = r.json && r.json.error && r.json.error.message || '';
    if(r.status===404 || (r.status===400 && /model/i.test(msg) && /not found|not supported|unknown/i.test(msg))) continue;
    return r;
  }
  return last;
}
const gemMsg = r => (r.json && r.json.error && r.json.error.message) || '';
async function askAI(q){
  const st = S.settings; if(!st.gemKey) return noKey(q);
  thinking('Buscando en internet…');
  const sys = 'Eres Rita, la asistente personal de '+(st.name||'Iván')+', un profesional autónomo de cerrajería y puertas en '+(st.home||'Cantabria')+' (España). Hoy es '+longDate(today())+' y son las '+hhmm()+'. '+
    'Responde siempre en español de España, claro y directo, en un máximo de tres frases cortas, sin markdown, sin listas y sin emojis, porque tu respuesta se leerá en voz alta. '+
    'Para datos actuales (noticias, cotizaciones, precios, resultados, horarios, normativa) usa la búsqueda de Google y da cifras concretas con su fecha o fuente. Si no estás seguro, dilo.';
  const contents = aiHist.slice(-6).map(h => ({role:h.role==='assistant'?'model':'user', parts:[{text:h.content}]})).concat([{role:'user', parts:[{text:q}]}]);
  const base = {systemInstruction:{parts:[{text:sys}]}, contents, generationConfig:{maxOutputTokens:2048, temperature:0.4}};
  let r = await gemCall(Object.assign({}, base, {tools:[{google_search:{}}]}), st.gemKey);
  let noSearch = false;
  if(!r.ok && !/api key|API_KEY/i.test(gemMsg(r)) && r.status!==429 && /search|ground|tool|billing|not supported|not enabled|free tier/i.test(gemMsg(r))){
    noSearch = true; r = await gemCall(base, st.gemKey);
  }
  if(!r.ok || !r.json){
    const em = gemMsg(r);
    if(/api key not valid|API_KEY_INVALID|api key expired|key.*invalid/i.test(em) || r.status===401) return reply('La clave de Google no es válida. Revísala en Ajustes.', [{label:'⚙ Ir a Ajustes', fn:() => { closeSheet(); go('ajustes'); }}]);
    if(r.status===429) return reply('Has llegado al límite de consultas de Google por ahora. Espera un minuto, o hasta mañana si es el límite diario gratuito.');
    if(r.status===403) return reply('Google no permite esa consulta con tu clave. Revisa que la clave esté activa en Google AI Studio.');
    return reply('No he podido consultarlo ahora mismo'+(r.status?' (error '+r.status+')':'')+'.');
  }
  const cand = r.json.candidates && r.json.candidates[0];
  if(!cand && r.json.promptFeedback && r.json.promptFeedback.blockReason) return reply('Google no me deja responder a eso.');
  const parts = (cand && cand.content && cand.content.parts) || [];
  const text = parts.filter(p => p.text && !p.thought).map(p => p.text).join(' ').replace(/\*+/g,'').replace(/\s+/g,' ').trim();
  const chunks = (cand && cand.groundingMetadata && cand.groundingMetadata.groundingChunks) || [];
  const links = []; const seen = {};
  for(const ch of chunks){ const w = ch.web; if(w && w.uri && !seen[w.uri] && links.length < 3){ seen[w.uri] = 1; links.push({label:'🔗 '+String(w.title || 'Fuente').slice(0,28), href:w.uri}); } }
  if(!text) return reply('No he conseguido una respuesta. Prueba a preguntarlo de otra forma.');
  aiHist.push({role:'user', content:q}, {role:'assistant', content:text}); while(aiHist.length > 8) aiHist.shift();
  reply(text + (noSearch ? ' (Respuesta sin datos de hoy: tu clave de Google no tiene la búsqueda activada.)' : ''), links);
}

const ICON_DEF = {text:'R', bg:'#1d4e89', fg:'#ffffff', acc:'#e87722', name:'Rita', custom:false, useImg:false, style:'rita'};
function drawRita(size){
  const s = size, cv = document.createElement('canvas'); cv.width = cv.height = s;
  const g = cv.getContext('2d');
  const gr = g.createLinearGradient(0, 0, s, s); gr.addColorStop(0, '#2f73bd'); gr.addColorStop(1, '#0f2f57');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
  // burbuja de diálogo
  const x = s*0.19, y = s*0.20, w = s*0.62, h = s*0.46, r = s*0.13;
  g.fillStyle = '#ffffff'; g.beginPath();
  g.moveTo(x+r, y); g.lineTo(x+w-r, y); g.quadraticCurveTo(x+w, y, x+w, y+r); g.lineTo(x+w, y+h-r); g.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  g.lineTo(x+w*0.40, y+h); g.lineTo(x+w*0.13, y+h+s*0.15); g.lineTo(x+w*0.20, y+h); g.lineTo(x+r, y+h); g.quadraticCurveTo(x, y+h, x, y+h-r);
  g.lineTo(x, y+r); g.quadraticCurveTo(x, y, x+r, y); g.closePath(); g.fill();
  // letra R
  g.fillStyle = '#0f2f57'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '800 '+(s*0.36)+'px system-ui, "Segoe UI", Roboto, Arial, sans-serif';
  g.fillText('R', x+w/2, y+h/2+s*0.02);
  // insignia naranja con visto (agenda hecha)
  const cx = s*0.70, cy = s*0.66, rr = s*0.125;
  g.fillStyle = '#ff8a1f'; g.beginPath(); g.arc(cx, cy, rr, 0, Math.PI*2); g.fill();
  g.lineWidth = s*0.022; g.strokeStyle = '#ffffff'; g.stroke();
  g.lineWidth = s*0.036; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#ffffff';
  g.beginPath(); g.moveTo(cx-rr*0.48, cy+rr*0.02); g.lineTo(cx-rr*0.12, cy+rr*0.40); g.lineTo(cx+rr*0.52, cy-rr*0.36); g.stroke();
  return cv;
}
const iconCfg = () => Object.assign({}, ICON_DEF, S.settings.icon || {});
function drawIcon(size, cfg, img){
  if(!img && cfg.style !== 'text') return drawRita(size);
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const g = cv.getContext('2d');
  g.fillStyle = cfg.bg; g.fillRect(0, 0, size, size);
  if(img){ const s = Math.min(img.width, img.height); g.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size); return cv; }
  const t = (cfg.text || 'MD').trim() || 'MD';
  const emoji = /\p{Extended_Pictographic}/u.test(t);
  g.fillStyle = cfg.fg; g.textAlign = 'center'; g.textBaseline = 'middle';
  const fs = size * (emoji ? 0.5 : (t.length >= 3 ? 0.30 : 0.40));
  g.font = '700 '+fs+'px system-ui, "Segoe UI", Roboto, Arial, sans-serif';
  g.fillText(t, size/2, size*(emoji ? 0.5 : 0.46));
  if(!emoji){ g.fillStyle = cfg.acc; const w = size*0.34, h = size*0.035; g.fillRect((size-w)/2, size*0.70, w, h); }
  return cv;
}
function getIconImg(){

window.addEventListener('appinstalled', () => { deferredInstall = null; toast('Rita instalada ✔'); render(); });
function installBtn(){
  if(isStandalone()) return '<p class="note" style="margin-top:6px">✅ Rita ya está instalada en este dispositivo.</p>';
  return '<div class="acts" style="margin-top:6px"><button class="btn ok" onclick="installApp()">📲 Poner en el escritorio</button></div>';

/* ======== NEGOCIO: trabajos, presupuestos, cobros y gastos ======== */
const eur = n => new Intl.NumberFormat('es-ES', {style:'currency', currency:'EUR', minimumFractionDigits:0, maximumFractionDigits:2}).format(Number(n)||0);
const JSTAT = {presupuestado:'Presupuestado', aceptado:'Aceptado', encurso:'En curso', terminado:'Terminado', cobrado:'Cobrado', perdido:'Perdido'};
const JCOL = {presupuestado:'#b7791f', aceptado:'#1d4e89', encurso:'#1d4e89', terminado:'#c9302c', cobrado:'#2e8b57', perdido:'#667385'};
const CATS = ['Combustible','Material','Herramientas','Comidas','Vehículo','Otros'];
let bizTab = 'cli', expMonth = today().slice(0,7), expReturn = null;
const jobRest = j => Math.max(0, (+j.amount||0) - (+j.paid||0));
const waName = cl => cl ? cl.name.replace(/\s*\([^)]*\)/g,'').trim() : '';
function moneyPending(){
  const debts = S.jobs.filter(j => j.status==='terminado' && jobRest(j) > 0);
  const quotes = S.jobs.filter(j => j.status==='presupuestado');
  const active = S.jobs.filter(j => j.status==='aceptado' || j.status==='encurso');
  const sum = (a, f) => a.reduce((s,j) => s + f(j), 0);
  return {debts, total:sum(debts, jobRest), quotes, quotesTotal:sum(quotes, j => +j.amount||0), active, activeTotal:sum(active, j => +j.amount||0)};
}
const jl = j => (j.title && !/^(?:presupuesto|trabajo)$/i.test(j.title)) ? ' «'+j.title+'»' : '';
const jobExp = j => S.expenses.filter(e => e.jobId === j.id);
const jobSpent = j => jobExp(j).reduce((s,e) => s + (+e.amount||0), 0);
function jobMarginTxt(j){ const g = jobSpent(j); if(!g) return ''; const m = (+j.amount||0) - g; return 'gastado '+eur(g)+(j.amount ? ' · margen '+eur(m)+' ('+Math.round(m/j.amount*100)+'%)' : ''); }
function jobOpts(sel){ return '<option value="">— Ninguno —</option>' + S.jobs.filter(j => j.status!=='perdido').map(j => `<option value="${j.id}" ${j.id===sel?'selected':''}>${esc(j.title)}${client(j.clientId)?' · '+esc(waName(client(j.clientId))):''}</option>`).join(''); }
function addMonthsISO(d, n){ const x = parse(d); x.setMonth(x.getMonth()+n); return iso(x); }
function monthStats(m){
  const inc = S.jobs.reduce((s,j) => s + (j.payments||[]).filter(p => p.date.slice(0,7)===m).reduce((a,p) => a + (+p.amount||0), 0), 0);
  const exp = S.expenses.filter(e => e.date.slice(0,7)===m).reduce((s,e) => s + (+e.amount||0), 0);
  return {inc, exp, net:inc-exp};
}
function quoteDue(j){ return j.sentDate ? addDays(j.sentDate, +j.followDays||7) : ''; }

/* --- tareas automáticas de seguimiento --- */
function upsertJobTasks(j){
  const setTask = (id, want) => {
    const old = S.tasks.find(t => t.id === id);
    if(!want){ if(old) S.tasks = S.tasks.filter(t => t.id !== id); return; }
    const t = Object.assign({id, kind:'llamada', clientId:j.clientId||'', time:'', prio:'normal', repeat:'no', remind:'0', notes:'', done:false, jobId:j.id}, want);
    if(old && old.due === t.due) t.done = old.done;
    if(old) S.tasks = S.tasks.map(x => x.id === id ? t : x); else S.tasks.push(t);
  };
  const cl = client(j.clientId);
  setTask('jf-'+j.id, j.status==='presupuestado' && j.sentDate ? {title:'Presupuesto'+jl(j)+(cl?' de '+waName(cl):'')+(j.amount?' ('+eur(j.amount)+')':'')+': preguntar si lo ha visto', due:quoteDue(j)} : null);
  setTask('jv-'+j.id, (j.status==='terminado' || j.status==='cobrado') && +j.revMonths > 0 && j.doneDate ? {title:'Ofrecer revisión'+jl(j)+(cl?' a '+waName(cl):''), due:addMonthsISO(j.doneDate, +j.revMonths)} : null);
  setTask('jg-'+j.id, (j.status==='terminado' || j.status==='cobrado') && +j.warrantyMonths > 0 && j.doneDate ? {kind:'tarea', title:'Termina la garantía'+jl(j)+(cl?' de '+waName(cl):''), due:addMonthsISO(j.doneDate, +j.warrantyMonths), remind:'43200', notes:'Garantía de '+j.warrantyMonths+' meses'} : null);
  setTask('jc-'+j.id, j.status==='terminado' && jobRest(j) > 0 ? {title:'Cobrar'+jl(j)+(cl?' a '+waName(cl):'')+': '+eur(jobRest(j)), due:j.dueDate || addDays(j.doneDate || today(), 15), prio:'alta'} : null);
}

  setTimeout(() => { const b = document.querySelector('.seg button.on'); if(b) b.scrollIntoView({inline:'center', block:'nearest'}); }, 0);

  if(bizTab==='quo') return head + viewQuotes();
  if(bizTab==='cat') return head + viewCatalog();

     <input type="file" id="vcf_file" accept=".vcf,text/vcard,text/x-vcard" style="display:none" onchange="importVcf(this)">`;
}
function jobRow(j){
  const cl = client(j.clientId), rest = jobRest(j);
  const sub = [cl && cl.name, j.status==='presupuestado' && j.sentDate ? 'enviado '+relDay(j.sentDate) : '', j.status==='terminado' && rest > 0 ? 'te debe '+eur(rest) : '', jobMarginTxt(j), warrantyEnd(j) ? 'garantía hasta '+shortDate(warrantyEnd(j)) : ''].filter(Boolean).join(' · ');
  return `<div class="row" onclick="jobForm('${j.id}')"><span class="ic">💶</span><div class="mid"><div class="t">${esc(j.title)}</div><div class="s">${esc(sub)||'&nbsp;'}</div></div>
   <div style="text-align:right;flex:none"><div style="font-weight:700">${eur(j.amount)}</div><div style="font-size:12px;font-weight:700;color:${JCOL[j.status]}">${JSTAT[j.status]}</div></div></div>`;

function viewJobs(){
  const m = moneyPending();
  const stats = `<div class="stats"><div class="stat"><b style="font-size:19px;color:var(--bad)">${eur(m.total)}</b><span>por cobrar</span></div>
   <div class="stat"><b style="font-size:19px">${m.quotes.length}</b><span>presupuestos · ${eur(m.quotesTotal)}</span></div>
   <div class="stat"><b style="font-size:19px">${eur(m.activeTotal)}</b><span>en marcha</span></div></div>`;
  const order = {terminado:0, presupuestado:1, encurso:2, aceptado:3, cobrado:4, perdido:5};

  return stats + '<div style="height:10px"></div>' + list(js.map(jobRow).join(''), 'Sin trabajos todavía. Pulsa «+ Trabajo» o dile a Rita: «he enviado presupuesto a Gómez de 1200 euros».') +
    `<div class="acts"><button class="btn" onclick="jobForm()">+ Trabajo</button><button class="btn sec" onclick="quoteImportSheet()">📥 Importar presupuesto</button>${S.settings.quoteUrl?`<a class="btn sec" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(S.settings.quoteUrl)}">🧮 Presupuesto rápido</a>`:''}</div>`;
}

  <label>Garantía de la instalación</label><select id="j_war"><option value="">Sin garantía</option>${[12,24,36,60].map(m => `<option value="${m}" ${+j.warrantyMonths===m?'selected':''}>${m/12} ${m>12?'años':'año'}</option>`).join('')}</select>
  ${id ? cuentasBlock(j) + partesList(j) : ''}
  ${id && j.quoteId && quoteOf(j.quoteId) ? `<div class="acts"><button class="btn sec" onclick="quoteForm('${j.quoteId}')">🧮 Ver presupuesto</button></div>` : ''}

function cuentasBlock(j){
  const g = jobSpent(j), m = (+j.amount||0) - g, min = jobMin(j), r = hourRate(), tc = min/60*r, run = S.settings.timer && S.settings.timer.jobId===j.id;
  const line = (a, b) => `<div style="display:flex;justify-content:space-between"><span>${a}</span><b>${b}</b></div>`;
  return `<div id="cuentas"><label>Cuentas del trabajo</label><div class="card" style="padding:10px 12px;font-size:14px">
   ${line('Presupuestado', eur(j.amount))}${line('Gastado en material', eur(g))}
   ${line('Margen', `<span style="color:${m<0?'var(--bad)':'var(--ok)'}">${eur(m)}${j.amount?' ('+Math.round(m/j.amount*100)+'%)':''}</span>`)}
   ${line('Horas trabajadas', fmtMin(min))}
   ${r ? line('Tu tiempo ('+eur(r)+'/h)', eur(tc)) + line('Margen tras tu tiempo', `<span style="color:${m-tc<0?'var(--bad)':'var(--ok)'}">${eur(m-tc)}</span>`) : ''}
   ${jobExp(j).slice(0,6).map(e => `<div class="s" style="font-size:12px;color:var(--mut);margin-top:3px">${shortDate(e.date)} · ${esc(e.concept)} · ${eur(e.amount)}</div>`).join('')}
   <div class="acts" style="margin-top:8px"><button class="btn sec sm" onclick="expFromJob('${j.id}')">+ Gasto</button>${run ? `<button class="btn bad sm" onclick="timerStopUI()">⏹ Parar cronómetro</button>` : `<button class="btn ok sm" onclick="timerFromJob('${j.id}')">▶ Empezar a trabajar</button>`}</div>
   <div style="display:flex;gap:6px;margin-top:8px"><input id="j_addh" type="number" step="0.25" inputmode="decimal" placeholder="+ horas (ej: 2,5)"><button class="btn sec sm" style="flex:none" onclick="addHours('${j.id}')">Añadir</button></div></div></div>`;
}
function expFromJob(id){ const j = S.jobs.find(x => x.id===id); if(!j) return; expForm(null, {jobId:id, clientId:j.clientId||'', cat:'Material'}); expReturn = id; }
function saveJob(id){
  const title = val('j_title').trim(); if(!title) return toast('Ponle un nombre al trabajo');
  const old = id ? S.jobs.find(x => x.id===id) : null;
  const status = val('j_status'); let paid = parseFloat(val('j_paid')) || 0; const amount = parseFloat(val('j_amount')) || 0;
  if(status==='cobrado' && paid < amount) paid = amount;
  const o = {...(old||{}), id:id||uid(), type:val('j_type'), title, clientId:val('j_client'), amount, status, sentDate:val('j_sent') || (status==='presupuestado' ? today() : ''), followDays:+val('j_follow')||7,
    dueDate:val('j_due'), paid, notes:val('j_notes').trim(), photos:phCtx.list.slice(), doneDate:(old && old.doneDate) || '', revMonths:+val('j_rev')||0, warrantyMonths:+val('j_war')||0, payments:(old && old.payments ? old.payments.slice() : [])};
  if(old && +old.base > 0 && amount !== +old.amount) delete o.base;
  if(status==='terminado' && !(old && old.status==='terminado')) o.doneDate = today();
  if((status==='terminado' || status==='cobrado') && !o.doneDate) o.doneDate = today();
  const delta = paid - ((old && +old.paid) || 0); if(delta > 0) o.payments.push({date:today(), amount:delta});
  if(id) S.jobs = S.jobs.map(x => x.id===id ? o : x); else S.jobs.push(o);
  upsertJobTasks(o); save(); closeSheet(); bizTab = 'jobs'; render(); toast('Trabajo guardado');
}
function delJob(id){
  if(!confirm('¿Borrar este trabajo?')) return;
  const j = S.jobs.find(x => x.id===id); (j && j.photos || []).forEach(p => photoDel(p).catch(()=>{}));
  S.jobs = S.jobs.filter(x => x.id!==id); S.tasks = S.tasks.filter(t => t.id!=='jf-'+id && t.id!=='jc-'+id);
  save(); closeSheet(); render();
}

/* --- gastos --- */
function guessCat(f){
  if(/gasolina|gasoil|diesel|combustible|gasolinera|repsol|cepsa/.test(f)) return 'Combustible';
  if(/tornillo|perfil|chapa|material|soldadura|electrodo|pintura|bisagra|cerradura|motor|pletina|tubo|ferreteria|cable|tuerca/.test(f)) return 'Material';
  if(/herramienta|taladro|amoladora|disco|broca|radial|llave inglesa/.test(f)) return 'Herramientas';
  if(/comida|menu|cafe|bar |restaurante|almuerzo|desayuno/.test(f)) return 'Comidas';
  if(/peaje|parking|aparcamiento|itv|seguro|neumatico|aceite|furgoneta|lavado/.test(f)) return 'Vehículo';
  return 'Otros';
}
function monthShift(m, n){ const [y,mo] = m.split('-').map(Number); const d = new Date(y, mo-1+n, 1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function viewGastos(){
  const ex = S.expenses.filter(e => e.date.slice(0,7)===expMonth).sort((a,b) => b.date.localeCompare(a.date));
  const total = ex.reduce((s,e) => s + (+e.amount||0), 0), ms = monthStats(expMonth);
  const by = {}; ex.forEach(e => by[e.cat] = (by[e.cat]||0) + (+e.amount||0));
  const [y,mo] = expMonth.split('-').map(Number);
  const rows = ex.map(e => `<div class="row" onclick="expForm('${e.id}')"><span class="ic">🧾</span><div class="mid"><div class="t">${esc(e.concept)}</div><div class="s">${shortDate(e.date)} · ${esc(e.cat)}${(S.jobs.find(j => j.id===e.jobId)||{}).title?' · 🔧 '+esc(S.jobs.find(j => j.id===e.jobId).title):(client(e.clientId)?' · '+esc(client(e.clientId).name):'')}</div></div><div style="font-weight:700;flex:none">${eur(e.amount)}</div></div>`).join('');
  return `<div class="wk" style="margin-top:12px"><button class="btn sec sm" onclick="expMonth=monthShift(expMonth,-1);render()">‹</button><b>${cap(MESES[mo-1])} ${y}</b><button class="btn sec sm" onclick="expMonth=monthShift(expMonth,1);render()">›</button></div>
   <div class="stats"><div class="stat"><b style="font-size:18px;color:var(--ok)">${eur(ms.inc)}</b><span>cobrado</span></div><div class="stat"><b style="font-size:18px">${eur(total)}</b><span>gastado</span></div><div class="stat"><b style="font-size:18px;color:${ms.net<0?'var(--bad)':'var(--pri)'}">${eur(ms.net)}</b><span>queda</span></div></div>
   <p class="note">${Object.entries(by).map(([k,v]) => k+' '+eur(v)).join(' · ') || 'Sin gastos este mes'} · «Cobrado» cuenta los cobros anotados con fecha.</p>
   <div style="height:10px"></div>` + list(rows, 'Sin gastos este mes. Di «gasolina 40 euros» o pulsa «+ Gasto».') +
   `<div class="acts"><button class="btn" onclick="expForm()">+ Gasto</button><button class="btn sec" onclick="exportExpensesCsv()">📊 Exportar mes (Excel)</button><button class="btn sec" onclick="informeSheet()">📑 Informe para el gestor</button></div>`;
}
function expForm(id, pre){
  expReturn = null;
  const e = id ? S.expenses.find(x => x.id===id) : Object.assign({date:today(), amount:'', concept:'', cat:'Otros', clientId:'', jobId:'', photos:[]}, pre||{});
  phCtx = {coll:'expenses', id:id||null, list:(e.photos||[]).slice()};
  sheet(`<h3>${id?'Editar gasto':'Nuevo gasto'}</h3>
