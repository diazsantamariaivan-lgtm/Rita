/* --- importar presupuestos de otra herramienta (JSON, CSV o texto) --- */
const kn = k => fold(k).replace(/[^a-z]/g,'');
const pickKey = (o, keys) => { for(const k of Object.keys(o)) if(keys.includes(kn(k))) return o[k]; return undefined; };
function numOf(v){
  if(typeof v === 'number') return v; if(typeof v !== 'string') return 0;
  let t = v.replace(/[^\d.,-]/g,'');
  if(/\d\.\d{3}(?!\d)/.test(t) && /,/.test(t)) t = t.replace(/\./g,'').replace(',','.');
  else if(/,\d{1,2}$/.test(t)) t = t.replace(',','.'); else t = t.replace(/,/g,'');
  return parseFloat(t) || 0;
}
function mapStatus(s){
  const f = fold(String(s||''));
  if(/rechaz|perdid|descart|cancel/.test(f)) return 'perdido';
  if(/cobrad|pagad|liquidad/.test(f)) return 'cobrado';
  if(/terminad|finaliz|entregad|hecho/.test(f)) return 'terminado';
  if(/en curso|curso|ejecuc|obra/.test(f)) return 'encurso';
  if(/acept|aprob|confirm/.test(f)) return 'aceptado';
  return 'presupuestado';
}
function toISOdate(v){
  const s = String(v||''); let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/.exec(s); if(m){ const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return y+'-'+pad(+m[2])+'-'+pad(+m[1]); }
  return '';
}
function normQuote(o){
  const lines = pickKey(o, ['lineas','lines','items','materiales','partidas','conceptos','detalle','articulos','productos']);
  let notes = '', total = numOf(pickKey(o, ['total','importe','amount','precio','totalfinal','totalconiva','totalcliente','presupuesto','totalpresupuesto']));
  if(Array.isArray(lines)){
    let sum = 0;
    notes = lines.map(l => {
      if(typeof l !== 'object' || !l) return String(l);
      const name = pickKey(l, ['concepto','nombre','descripcion','name','description','articulo','producto','material']) || '';
      const qty = numOf(pickKey(l, ['cantidad','qty','unidades','uds','cant'])) || 1, pr = numOf(pickKey(l, ['precio','price','pvp','importe','preciounitario','unitario']));
      sum += qty * pr; return (qty !== 1 ? num(qty,2)+' × ' : '')+name+(pr ? ' — '+eur(qty*pr) : '');
    }).join('\n');
    if(!total) total = Math.round(sum*100)/100;
  } else if(typeof lines === 'string') notes = lines;
  let paid = numOf(pickKey(o, ['anticipo','pagado','cobrado','paid','entregado','acuenta']));
  const pagos = pickKey(o, ['pagos','anticipos','payments','cobros']);
  if(!paid && Array.isArray(pagos)) paid = pagos.reduce((s,p) => s + (typeof p === 'object' && p ? numOf(pickKey(p, ['importe','amount','cantidad','pago'])) : numOf(p)), 0);
  const cli = pickKey(o, ['cliente','client','customer','clientenombre','nombrecliente']);
  return {title:String(pickKey(o, ['titulo','title','nombre','name','concepto','descripcion','obra','trabajo','referencia','ref']) || '').slice(0,80),
    client:typeof cli === 'object' && cli ? String(pickKey(cli, ['nombre','name']) || '') : String(cli||''), amount:total, status:mapStatus(pickKey(o, ['estado','status','situacion'])),
    paid, sentDate:toISOdate(pickKey(o, ['fecha','date','creado','created','fechaenvio','fechacreacion'])) || today(), notes:notes.slice(0,900)};
}
function findQuoteObjs(j, depth){
  depth = depth || 0;
  if(Array.isArray(j)) return j.length && typeof j[0] === 'object' && !Array.isArray(j[0]) ? j.filter(x => x && typeof x === 'object') : [];
  if(j && typeof j === 'object'){
    const keys = Object.keys(j).map(kn);
    if(keys.some(k => ['total','importe','lineas','lines','items','cliente','client'].includes(k))) return [j];
    const pref = Object.keys(j).filter(k => /presup|guard|saved|quote|budget|oferta|proyecto|trabajo/.test(fold(k)));
    const src = pref.length ? pref.map(k => j[k]) : Object.values(j);
    if(depth < 3) return src.flatMap(v => findQuoteObjs(v, depth+1));
  }
  return [];
}
function splitCsvLine(l, d){ const out = []; let cur = '', q = false; for(const ch of l){ if(ch === '"') q = !q; else if(ch === d && !q){ out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out.map(x => x.trim()); }
function parseQuotes(txt){
  txt = String(txt||'').trim(); if(!txt) return [];
  try{ return findQuoteObjs(JSON.parse(txt)).map(normQuote).filter(q => q.amount || q.title); }catch(_){}
  const ls = txt.split(/\r?\n/).filter(l => l.trim());
  const d = ls[0] && (ls[0].split(';').length > 1 ? ';' : (ls[0].split(',').length > 2 ? ',' : ''));
  if(d && ls.length > 1){
    const head = splitCsvLine(ls[0], d), hk = head.map(kn);
    if(hk.some(k => ['cliente','titulo','total','importe','nombre','presupuesto'].includes(k)) && !hk.includes('cantidad')){
      return ls.slice(1).map(l => { const cells = splitCsvLine(l, d), o = {}; head.forEach((h,i) => o[h] = cells[i]); return normQuote(o); }).filter(q => q.amount || q.title);
    }
  }
  const tm = /total[^\d\n]*([\d.]+(?:,\d{1,2})?)/i.exec(txt) || /([\d.]+(?:,\d{1,2})?)\s*€\s*$/m.exec(txt);
  const title = (ls.find(l => !/^\s*(?:total|iva|subtotal|base)/i.test(l)) || 'Presupuesto').trim().slice(0,60);
  return [{title, client:'', amount:tm ? numOf(tm[1]) : 0, status:'presupuestado', paid:0, sentDate:today(), notes:txt.slice(0,900)}];
}

function quoteImportSheet(){
  qiList = [];
  sheet(`<h3>📥 Importar presupuesto</h3>
  <p class="note">Pega aquí el presupuesto o el archivo que exportes de tu «presupuesto rápido» (JSON, CSV o texto) y Rita crea el trabajo con su importe, cliente y materiales.</p>
  <textarea id="q_txt" style="min-height:120px" placeholder="Pega aquí…" oninput="quotePreview()"></textarea>
  <div class="acts"><button class="btn sec" onclick="quotePaste()">📋 Pegar</button><button class="btn sec" onclick="$('#q_file').click()">📄 Elegir archivo</button></div>
  <input type="file" id="q_file" accept=".json,.csv,.txt,text/*,application/json" style="display:none" onchange="quoteFile(this)">
  <div id="q_prev" class="note" style="margin-top:8px"></div>
  <div class="acts"><button class="btn" id="q_go" onclick="quoteImportGo()" disabled>Importar</button><button class="btn sec" onclick="closeSheet()">Cancelar</button></div>`);
}
async function quotePaste(){ try{ $('#q_txt').value = await navigator.clipboard.readText(); quotePreview(); }catch(_){ toast('No puedo leer el portapapeles: pega con una pulsación larga en el cuadro'); } }
function quoteFile(inp){ const f = inp.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => { $('#q_txt').value = String(r.result).slice(0,300000); quotePreview(); }; r.readAsText(f); inp.value = ''; }
function quotePreview(){
  qiList = parseQuotes(val('q_txt')); const p = $('#q_prev'), b = $('#q_go');
  if(!p) return;
  if(!qiList.length){ p.textContent = val('q_txt').trim() ? 'No he reconocido ningún presupuesto en ese texto.' : ''; if(b){ b.disabled = true; b.textContent = 'Importar'; } return; }
  p.innerHTML = '<b>He encontrado '+qiList.length+(qiList.length===1?' presupuesto':' presupuestos')+':</b><br>'+qiList.slice(0,8).map(q => '• '+esc(q.title || 'Presupuesto')+(q.client?' ('+esc(q.client)+')':'')+' · '+eur(q.amount)+' · '+JSTAT[q.status]).join('<br>')+(qiList.length>8?'<br>…':'');
  if(b){ b.disabled = false; b.textContent = 'Importar '+qiList.length; }
}
function quoteImportGo(){
  let n = 0;
  for(const q of qiList){
    let cid = '';
    if(q.client){
      const f = fold(q.client); let c = S.clients.find(x => fold(x.name)===f || fold(x.name).includes(f) || f.includes(fold(x.name)));
      if(!c){ c = {id:uid(), name:q.client, phone:'', address:'', notes:''}; S.clients.push(c); }
      cid = c.id;
    }
    const j = {id:uid(), title:q.title || 'Presupuesto', clientId:cid, amount:q.amount, status:q.status, sentDate:q.sentDate, followDays:7, dueDate:'', paid:q.paid||0, notes:q.notes, photos:[],
      payments:q.paid ? [{date:today(), amount:q.paid}] : [], doneDate:(q.status==='terminado' || q.status==='cobrado') ? today() : ''};
    S.jobs.push(j); upsertJobTasks(j); n++;
  }
  save(); closeSheet(); bizTab = 'jobs'; tab = 'clientes'; render(); toast(n+(n===1?' trabajo importado':' trabajos importados'));
}

/* ======== Arranque ======== */
if(/^https?:/.test(location.protocol)){
  const ml = document.createElement('link'); ml.rel = 'manifest'; ml.href = 'manifest.json'; document.head.appendChild(ml);
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
setInterval(checkReminders, 20000);
document.addEventListener('visibilitychange', () => { if(!document.hidden){ checkReminders(); if(tab==='hoy') render(); } });
lockInit();
setInterval(() => { if(S.settings.timer && tab==='hoy' && !$('#sheet').classList.contains('open')) render(); }, 60000);
$('#mic').addEventListener('click', () => openVoice());
if('speechSynthesis' in window) speechSynthesis.getVoices();
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
render();
checkReminders();
idbRestore();
refreshWx(); setInterval(refreshWx, 30*60e3);
applyIcon();
setTimeout(() => { syncNow(false).then(() => syncNtfy()); }, 1200);
setInterval(() => { syncNow(false); syncNtfy(); }, 20*60*1000);
document.addEventListener('visibilitychange', () => { if(!document.hidden){ syncNow(false); syncNtfy(); } });
</script>
